<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#140b24">
<title>إحنا على المريخ 🚀 دوّر على قبتك</title>
<meta name="description" content="مدينة على المريخ مبنية بأسامي المتابعين. كل كومنت = قبة باسمك وعلم بلدك.">
<meta property="og:title" content="إحنا على المريخ 🚀 دوّر على قبتك">
<meta property="og:description" content="كل كومنت = قبة باسمك وعلم بلدك على المريخ">
<link rel="preload" href="fonts/Cairo-Black.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face { font-family: Cairo; src: url(fonts/Cairo-Black.ttf); font-weight: 100 900; font-display: swap; }
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #140b24; color: #fff; font-family: Cairo, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; -webkit-text-size-adjust: 100%; }
#c { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; touch-action: none; }
#labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

/* name tags */
.lab { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; background: #fff8e8; color: #1b1210; border: 2.5px solid #1b1210; border-radius: 12px; padding: 1px 9px 2px; text-align: center; white-space: nowrap; box-shadow: 0 3px 0 #1b1210; transform-origin: 50% 100%; line-height: 1.25; }
.lab b { display: flex; align-items: center; gap: 5px; font-size: 15px; font-weight: 900; justify-content: center; }
.lab img { width: 20px; height: 13px; border: 1.5px solid #1b1210; border-radius: 3px; }
.lab i { display: none; font: 700 10px/1.1 Arial, sans-serif; opacity: .75; font-style: normal; }
.lab.full i { display: block; }
.lab.sel { background: #ffd23f; animation: bob .9s ease-in-out infinite alternate; }
.lab.sel b { font-size: 18px; }
.lab.free { background: #2a1a3a; color: #ffd23f; border-color: #ffd23f; box-shadow: 0 3px 0 #000; font-size: 13px; font-weight: 900; }
.lab.place { background: #1b1210; color: #ffd23f; font-size: 13px; font-weight: 900; pointer-events: none; padding: 0 8px; }
@keyframes bob { to { margin-top: -5px; } }

/* top */
#hud { position: fixed; top: 0; left: 0; right: 0; padding: calc(env(safe-area-inset-top) + 10px) 12px 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; align-items: center; }
#hud > * { pointer-events: auto; }
#top { display: flex; align-items: center; gap: 10px; justify-content: space-between; width: 100%; max-width: 520px; }
h1 { font-size: 18px; font-weight: 900; text-shadow: 0 2px 0 #000; white-space: nowrap; }
#stat { background: rgba(20,11,36,.85); border: 2px solid #ffd23f; border-radius: 12px; padding: 2px 10px 5px; min-width: 0; }
#stat .row { display: flex; align-items: baseline; gap: 6px; white-space: nowrap; }
#stat b { font-size: 19px; color: #ffd23f; }
#stat small { font-size: 11px; opacity: .9; }
#bar { height: 5px; background: #3b2a4f; border-radius: 4px; overflow: hidden; }
#bar i { display: block; height: 100%; background: linear-gradient(90deg, #ffd23f, #ff8a2a); border-radius: 4px; }
#chips { order: 3; display: flex; gap: 4px; flex-wrap: nowrap; justify-content: center; max-width: 520px; }
#chips .res { display: flex; align-items: center; gap: 3px; background: rgba(20,11,36,.85); color: #fff; border: 2px solid #5be38a; border-radius: 12px; font: 900 12px Cairo, sans-serif; padding: 2px 6px; cursor: pointer; white-space: nowrap; }
#chips .res b { color: #5be38a; }
#chips .res.low { border-color: #ff5a3c; animation: warn 1.2s ease-in-out infinite; }
#chips .res.low b { color: #ff7a5c; }
@keyframes warn { 50% { box-shadow: 0 0 0 3px rgba(255,90,60,.45); } }
.lab.fac { background: #10324a; color: #bfeaff; border-color: #3fc1ff; box-shadow: 0 3px 0 #000; font-size: 13px; font-weight: 900; }
.lab.fac.sel { background: #3fc1ff; color: #10202a; }
#chalBtn { white-space: nowrap; background: rgba(20,11,36,.85); color: #ffd23f; border: 2px solid #ffd23f; border-radius: 12px; font: 900 12px Cairo, sans-serif; padding: 2px 8px; cursor: pointer; }
.lab.chal { background: #3a0f0a; color: #ffb48a; border-color: #ff8a4a; box-shadow: 0 3px 0 #000; font-size: 14px; font-weight: 900; }
.lab.chal.sel { background: #ff8a4a; color: #1b1210; }
#card.chal #share { background: #ff6a2a; }
#search { position: relative; width: 100%; max-width: 520px; }
#q { width: 100%; font: 900 16px Cairo, sans-serif; padding: 9px 42px 9px 12px; border-radius: 14px; border: 2.5px solid #1b1210; background: #fff8e8; color: #1b1210; box-shadow: 0 3px 0 #1b1210; outline: none; -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; }
#search::before { content: '🔍'; position: absolute; right: 13px; top: 10px; font-size: 17px; pointer-events: none; }
#results { position: absolute; top: 50px; left: 0; right: 0; display: flex; flex-direction: column; gap: 5px; z-index: 5; }
#results button, #results .none { display: flex; align-items: center; gap: 7px; font: 900 16px Cairo, sans-serif; text-align: right; padding: 10px 12px; min-height: 46px; border-radius: 12px; border: 2px solid #1b1210; background: #fff8e8; color: #1b1210; cursor: pointer; }
#results img { width: 22px; height: 14px; border: 1.5px solid #1b1210; border-radius: 3px; }
#results span { font: 700 12px Arial, sans-serif; opacity: .65; overflow: hidden; text-overflow: ellipsis; }
#results .none { display: block; }
#results a { color: #b3261e; }

/* bottom */
#bottom { position: fixed; bottom: 0; left: 0; right: 0; padding: 0 12px calc(env(safe-area-inset-bottom) + 12px); display: flex; gap: 8px; justify-content: center; align-items: stretch; }
#cta { flex: 1; max-width: 440px; display: block; text-decoration: none; text-align: center; background: #ffd23f; color: #1b1210; border: 2.5px solid #1b1210; border-radius: 14px; padding: 7px 12px; box-shadow: 0 4px 0 #1b1210; font-weight: 900; font-size: 15px; line-height: 1.3; }
#cta small { display: block; font-size: 12px; opacity: .8; }
#cta.pulse { animation: pulse .45s 3; }
@keyframes pulse { 50% { transform: scale(1.05); } }
#home { flex: none; width: 58px; background: #1b1210; color: #fff; border: 2px solid #ffd23f; border-radius: 14px; font: 900 11px/1.2 Cairo, sans-serif; cursor: pointer; padding: 4px; }
#home span { display: block; font-size: 20px; }
#hint { white-space: nowrap; position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom) + 86px); text-align: center; font-size: 13px; pointer-events: none; transition: opacity .6s; }
#hint span { background: rgba(20,11,36,.8); padding: 4px 12px; border-radius: 10px; }
#hint.off { opacity: 0; }

/* selected dome card */
#card { position: fixed; left: 12px; right: 12px; bottom: calc(env(safe-area-inset-bottom) + 84px); margin: 0 auto; max-width: 440px; background: #fff8e8; color: #1b1210; border: 2.5px solid #1b1210; border-radius: 16px; box-shadow: 0 4px 0 #1b1210; padding: 10px 12px; display: flex; align-items: center; gap: 10px; transform: translateY(140%); opacity: 0; transition: transform .35s cubic-bezier(.2,1.3,.4,1), opacity .2s; }
#card.on { transform: none; opacity: 1; }
#card .who { flex: 1; min-width: 0; }
#cardName { display: flex; align-items: center; gap: 6px; font-size: 20px; font-weight: 900; line-height: 1.2; }
#cardName img { width: 26px; height: 17px; border: 1.5px solid #1b1210; border-radius: 3px; }
#cardHandle { font: 700 12px Arial, sans-serif; opacity: .7; direction: ltr; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cardWhere { font-size: 12px; opacity: .8; }
#share { flex: none; background: #25a244; color: #fff; border: 2px solid #1b1210; border-radius: 12px; font: 900 15px Cairo, sans-serif; padding: 8px 14px; min-height: 44px; cursor: pointer; box-shadow: 0 3px 0 #1b1210; }
#close { position: absolute; top: -12px; left: -8px; width: 30px; height: 30px; border-radius: 50%; border: 2px solid #1b1210; background: #fff; font: 900 15px Arial; color: #1b1210; cursor: pointer; }
body.carded #hint { display: none; }
#toast { position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%); background: #1b1210; color: #fff; padding: 8px 16px; border-radius: 12px; font-weight: 900; opacity: 0; pointer-events: none; transition: opacity .25s; }
#toast.on { opacity: 1; }

@media (min-width: 700px) {
  h1 { font-size: 22px; }
  .lab b { font-size: 17px; }
  #bottom { padding-bottom: 16px; }
}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="labels"></div>
<div id="hud">
  <div id="top">
    <h1>إحنا على المريخ 🚀</h1>
    <div id="stat"><div class="row"><b id="count">٥٤</b><small>ساكن · الهدف <span id="goal">١٠٠</span></small></div><div id="bar"><i></i></div></div>
  </div>
  <div id="chips"><button id="chalBtn">⛰️ التحديات</button></div>
  <div id="search"><input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="دوّر على قبتك: اسمك أو @يوزرك" autocomplete="off" autocorrect="off" spellcheck="false"><div id="results"></div></div>
</div>
<div id="hint"><span>👆 اسحب · ✌️ قرّب ولِف · دوس على أي قبة</span></div>
<div id="card"><button id="close" aria-label="إغلاق">✕</button><div class="who"><div id="cardName"></div><div id="cardHandle"></div><div id="cardWhere"></div></div><button id="share">شارك قبتك 📤</button></div>
<div id="bottom">
  <a id="cta" target="_blank" rel="noopener">اكتب اسمك وعلم بلدك في كومنت 👇<small>لسه فيه <span id="free">٩</span> أراضي فاضية في الحي الجديد</small></a>
  <button id="home" aria-label="المدينة كلها"><span>🏙️</span>المدينة</button>
</div>
<div id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
